<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="认知简报 · 探索路径图概念（极简）">
  <!-- ══ 极简版概念：数据即图形 ══
       词汇表（全部 ≤4 种形状）：线=研究线（粗=主线）；点=工作节点；
       ✕=死巷终点；实心菱形=断言裁定；汇流实点=并入。
       颜色 ≤3：暖白底 / 暖灰中性 / 单一强调色。零图例——悬停即释（正式版）。 -->
  <defs>
    <linearGradient id="fadeB" x1="0" x2="1">
      <stop offset="0" stop-color="#b8b0a4"/>
      <stop offset="1" stop-color="#b8b0a4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeC" x1="0" x2="1">
      <stop offset="0" stop-color="#b8b0a4"/>
      <stop offset="1" stop-color="#b8b0a4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底：暖白，无边框无纹理 -->
  <rect width="900" height="430" fill="#fbfaf8"/>

  <!-- 时间轴：唯一的一条基准线，两个刻度即全部文字 -->
  <line x1="60" y1="382" x2="840" y2="382" stroke="#d8d2c8" stroke-width="1"/>
  <line x1="60" y1="378" x2="60" y2="386" stroke="#c4bcb0" stroke-width="1"/>
  <line x1="840" y1="378" x2="840" y2="386" stroke="#c4bcb0" stroke-width="1"/>
  <text x="60" y="404" font-family="Georgia, serif" font-size="10" fill="#a8a094" text-anchor="middle">2026-08</text>
  <text x="840" y="404" font-family="Georgia, serif" font-size="10" fill="#a8a094" text-anchor="middle">今</text>
  <line x1="840" y1="60" x2="840" y2="382" stroke="#e4ded4" stroke-width="1"/>

  <!-- 支线 C（上·死巷）：从支线 A 分出，渐隐终止 -->
  <path d="M 430 118 C 448 100 460 84 470 72 L 540 72" fill="none" stroke="url(#fadeC)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 546 72 l 0 0" stroke="none"/>
  <g stroke="#a2573f" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <path d="M 548 65 l 12 12 M 560 65 l -12 12"/>
  </g>

  <!-- 支线 A（上·并入）：从主线荡出，弧线汇回 -->
  <path d="M 240 210 C 262 196 276 160 296 138 L 424 118 C 500 106 560 140 604 196 Q 612 208 620 210"
        fill="none" stroke="#b8b0a4" stroke-width="3" stroke-linecap="round"/>

  <!-- 支线 B（下·死巷）：渐隐终止 -->
  <path d="M 340 212 C 362 232 384 268 404 292 L 560 316" fill="none" stroke="#b8b0a4" stroke-width="3" stroke-linecap="round"/>
  <path d="M 560 316 L 648 326" fill="none" stroke="url(#fadeB)" stroke-width="2.5" stroke-linecap="round"/>
  <g stroke="#a2573f" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <path d="M 654 319 l 12 12 M 666 319 l -12 12"/>
  </g>

  <!-- 支线 D（下·进行中）：跑到当下线 -->
  <path d="M 600 214 C 640 240 680 300 716 342 L 838 366" fill="none" stroke="#b8b0a4" stroke-width="3" stroke-linecap="round"/>

  <!-- 主线：唯一强调色，最粗 -->
  <path d="M 60 210 L 838 210" fill="none" stroke="#c96f4a" stroke-width="6" stroke-linecap="round"/>

  <!-- 汇流实点：并入（A 回到主线处） -->
  <circle cx="620" cy="210" r="5" fill="#c96f4a"/>

  <!-- 工作节点：小点，比线色深一档 -->
  <g fill="#8b8378">
    <circle cx="120" cy="210" r="3"/>
    <circle cx="205" cy="210" r="3.6"/>
    <circle cx="330" cy="210" r="3"/>
    <circle cx="455" cy="210" r="3.6"/>
    <circle cx="540" cy="210" r="3"/>
    <circle cx="720" cy="210" r="3.6"/>
    <circle cx="330" cy="131" r="3"/>
    <circle cx="382" cy="124" r="3.6"/>
    <circle cx="540" cy="160" r="3"/>
    <circle cx="452" cy="283" r="3.4"/>
    <circle cx="512" cy="305" r="3"/>
    <circle cx="760" cy="354" r="3.4"/>
  </g>

  <!-- 断言裁定：实心菱形（supported）；空心菱形（invalidated）备用 -->
  <g transform="translate(508,210) rotate(45)">
    <rect x="-4.2" y="-4.2" width="8.4" height="8.4" fill="#c96f4a"/>
  </g>
  <g transform="translate(296,138) rotate(45)">
    <rect x="-3.6" y="-3.6" width="7.2" height="7.2" fill="#8b8378"/>
  </g>

  <!-- 右上角唯一一行状态摘要（可选层，正式版由卡片承担） -->
  <text x="840" y="40" font-family="Georgia, serif" font-size="10.5" fill="#a8a094" text-anchor="end" letter-spacing="1">4 线 · 1 收束 · 2 死巷 · 1 进行中</text>
</svg>
